<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="theme-color" content="#101418">
        <meta name="description" content="Character lab: build a hero or an orc, dress and arm them, and watch them walk">

        <title>Character Lab</title>

        <link rel="icon" href="images/icons/icon-192.png" type="image/png">
        <link rel="stylesheet" href="character-lab.css">
        <script type="importmap">
            {
                "imports": {
                    "three": "./vendor/three-r186/three.module.min.js",
                    "three/addons/": "./vendor/three-r186/addons/"
                }
            }
        </script>
        <script type="module" src="js/lab/character-lab.js"></script>
    </head>
    <body>
        <main id="lab">
            <section id="viewport" aria-label="Character view">
                <canvas id="view"></canvas>

                <div class="overlay overlay-top">
                    <div class="segmented" role="radiogroup" aria-label="Character" id="characterpicker"></div>
                    <div class="segmented" role="radiogroup" aria-label="Camera" id="camerapicker">
                        <button type="button" role="radio" data-camera="orbit" aria-checked="true">Orbit</button>
                        <button type="button" role="radio" data-camera="game" aria-checked="false">Game view</button>
                    </div>
                </div>

                <div class="overlay overlay-bottom">
                    <div id="stats" aria-live="off"></div>
                </div>

                <div id="status" role="status">Loading the body…</div>
            </section>

            <aside id="panel" aria-label="Character settings">
                <nav class="tabs" role="tablist" id="tabs"></nav>
                <div id="tabpanels"></div>
            </aside>
        </main>
        <noscript>The character lab needs JavaScript.</noscript>
    </body>
</html>
