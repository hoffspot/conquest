<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="theme-color" content="#101418">
        <meta name="description" content="Building lab: the houses, landmarks and towns of Pellagos built in 3D from a seed, to walk round and look at">

        <title>Building Lab</title>

        <link rel="icon" href="images/icons/icon-192.png" type="image/png">
        <link rel="stylesheet" href="world-map.css">
        <script type="importmap">
            {
                "imports": {
                    "three": "./vendor/three-r186/three.module.min.js",
                    "three/addons/": "./vendor/three-r186/addons/"
                }
            }
        </script>
        <script type="module" src="js/lab/building-lab.js"></script>
    </head>
    <body>
        <main id="atlas">
            <section id="viewport" aria-label="The buildings">
                <canvas id="map"></canvas>
                <div id="status" role="status">Building…</div>
            </section>

            <aside id="panel" aria-label="Building settings">
                <h1>Buildings</h1>

                <form id="seedform" class="row">
                    <label for="seed">Seed</label>
                    <input id="seed" name="seed" type="number" min="0" step="1" inputmode="numeric">
                    <button type="submit">Build</button>
                    <button type="button" id="another">Another</button>
                </form>

                <div class="row">
                    <label for="people">People</label>
                    <select id="people">
                        <option value="human">Humans</option>
                        <option value="elf">Elves</option>
                        <option value="darkElf">Dark elves</option>
                        <option value="cat">Cat folk</option>
                        <option value="lizard">Lizard folk</option>
                        <option value="orc">Orcs</option>
                    </select>
                </div>

                <div class="row">
                    <label for="show">Show</label>
                    <select id="show">
                        <option value="street">A street of every style</option>
                        <option value="landmarks">Taverns, the guild, churches, the smithy, a town hall, a keep</option>
                        <option value="structures">Their own places: special structures, a castle, walls and a gate</option>
                        <option value="insides">Insides: a tavern, a smithy, a temple, a guild, a town hall, a keep</option>
                        <option value="castle">Their castle, out in the world</option>
                        <option value="place">One of their own places, out in the world</option>
                        <option value="town">The town</option>
                        <option value="village">A village out in the world</option>
                        <option value="hamlet">A hamlet</option>
                        <option value="farmstead">A farmstead</option>
                        <option value="city">A city</option>
                        <option value="capital">A capital</option>
                        <option value="camps">Every people's war camp</option>
                        <option value="forts">Every people's guard tower and forward garrison</option>
                        <option value="home">Their homeland: its ground and what lies about</option>
                        <option value="wilds-meadow">The land: meadow</option>
                        <option value="wilds-farmland">The land: farmland</option>
                        <option value="wilds-woods">The land: woods</option>
                        <option value="wilds-heath">The land: heath</option>
                        <option value="wilds-marsh">The land: marsh</option>
                        <option value="wilds-elfwood">The land: elves' woods</option>
                        <option value="wilds-darkwood">The land: darkwood</option>
                        <option value="wilds-savannah">The land: savannah</option>
                        <option value="wilds-jungle">The land: jungle</option>
                        <option value="wilds-badlands">The land: badlands</option>
                        <option value="wilds-volcanic">The land: volcanic ash</option>
                        <option value="wilds-tundra">The land: tundra</option>
                        <option value="wilds-snow">The land: snow</option>
                        <option value="wilds-mountain">The land: mountains</option>
                        <option value="wilds-beach">The land: a beach</option>
                    </select>
                </div>

                <section>
                    <h2>Drawn</h2>
                    <ul id="counts" class="key"></ul>
                </section>

                <p class="hint">Drag to go round, pinch or scroll to come closer.</p>
            </aside>
        </main>
        <noscript>The building lab needs JavaScript.</noscript>
    </body>
</html>
