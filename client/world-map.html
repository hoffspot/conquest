<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="theme-color" content="#101418">
        <meta name="description" content="World map: the whole world of Pellagos laid out from a seed, its peoples, settlements, roads, ruins and camps">

        <title>World Map</title>

        <link rel="icon" href="images/icons/icon-192.png" type="image/png">
        <link rel="stylesheet" href="world-map.css">
        <script type="module" src="js/lab/world-map.js"></script>
    </head>
    <body>
        <main id="atlas">
            <section id="viewport" aria-label="The world">
                <canvas id="map"></canvas>
                <div id="hover" role="status" aria-live="off" hidden></div>
                <div id="status" role="status">Laying out the world…</div>
                <div class="zoom">
                    <button type="button" id="zoomin" aria-label="Zoom in">+</button>
                    <button type="button" id="zoomout" aria-label="Zoom out">−</button>
                    <button type="button" id="zoomall" aria-label="Show the whole world">⤢</button>
                </div>
            </section>

            <aside id="panel" aria-label="World settings">
                <h1>The world</h1>

                <form id="seedform" class="row">
                    <label for="seed">Seed</label>
                    <input id="seed" name="seed" type="number" min="0" step="1" inputmode="numeric">
                    <button type="submit">Lay out</button>
                    <button type="button" id="another">Another</button>
                </form>

                <div class="row">
                    <label for="people">Start as</label>
                    <select id="people"></select>
                </div>
                <p id="start" class="muted"></p>

                <fieldset id="layers">
                    <legend>Show</legend>
                </fieldset>

                <section>
                    <h2>Peoples</h2>
                    <ul id="peoples" class="key"></ul>
                </section>

                <section>
                    <h2>Lands</h2>
                    <ul id="lands" class="key"></ul>
                </section>

                <section>
                    <h2>In the world</h2>
                    <ul id="counts" class="key"></ul>
                </section>
            </aside>
        </main>
        <noscript>The world map needs JavaScript.</noscript>
    </body>
</html>
