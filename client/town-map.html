<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="theme-color" content="#101418">
        <meta name="description" content="Town map: a village, town or city of Pellagos laid out from a seed, its streets, houses, landmarks and yards">

        <title>Town Map</title>

        <link rel="icon" href="images/icons/icon-192.png" type="image/png">
        <link rel="stylesheet" href="world-map.css">
        <script type="module" src="js/lab/town-map.js"></script>
    </head>
    <body>
        <main id="atlas">
            <section id="viewport" aria-label="The town">
                <canvas id="map"></canvas>
                <div id="status" role="status">Laying out the town…</div>
            </section>

            <aside id="panel" aria-label="Town settings">
                <h1>The town</h1>

                <form id="seedform" class="row">
                    <label for="seed">Seed</label>
                    <input id="seed" name="seed" type="number" min="0" step="1" inputmode="numeric">
                    <button type="submit">Lay out</button>
                    <button type="button" id="another">Another</button>
                </form>

                <div class="row">
                    <label for="kind">Kind</label>
                    <select id="kind"></select>
                </div>

                <fieldset id="layers">
                    <legend>Show</legend>
                </fieldset>

                <section>
                    <h2>In it</h2>
                    <ul id="counts" class="key"></ul>
                </section>

                <section>
                    <h2>Key</h2>
                    <ul id="key" class="key"></ul>
                </section>
            </aside>
        </main>
        <noscript>The town map needs JavaScript.</noscript>
    </body>
</html>
