<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="theme-color" content="#101418">
        <meta name="description" content="Dungeon map: a dungeon of Pellagos cooked up from a seed and a theme, level by level, its rooms, stairs, boss, mini-bosses, packs, chests, props and torches">

        <title>Dungeon Map</title>

        <link rel="icon" href="images/icons/icon-192.png" type="image/png">
        <link rel="stylesheet" href="world-map.css">
        <script type="module" src="js/lab/dungeon-map.js"></script>
    </head>
    <body>
        <main id="atlas">
            <section id="viewport" aria-label="The dungeon">
                <canvas id="map"></canvas>
                <div id="hover" hidden></div>
                <div id="status" role="status">Cooking up the dungeon…</div>
            </section>

            <aside id="panel" aria-label="Dungeon settings">
                <h1 id="name">The dungeon</h1>

                <form id="seedform" class="row">
                    <label for="seed">Seed</label>
                    <input id="seed" name="seed" type="number" min="0" step="1" inputmode="numeric">
                    <button type="submit">Make</button>
                    <button type="button" id="another">Another</button>
                </form>

                <div class="row">
                    <label for="theme">Theme</label>
                    <select id="theme"></select>
                </div>

                <div class="row">
                    <label for="depth">Levels</label>
                    <select id="depth">
                        <option value="">By seed</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                    </select>
                    <label for="tier">Tier</label>
                    <select id="tier"></select>
                </div>

                <div class="row">
                    <label for="generation">Made</label>
                    <select id="generation"></select>
                </div>

                <div class="row" id="levels" role="group" aria-label="Level"></div>

                <fieldset id="layers">
                    <legend>Show</legend>
                </fieldset>

                <section>
                    <h2>In it</h2>
                    <ul id="counts" class="key"></ul>
                </section>

                <section>
                    <h2>Key</h2>
                    <ul id="key" class="key"></ul>
                </section>
            </aside>
        </main>
        <noscript>The dungeon map needs JavaScript.</noscript>
    </body>
</html>
