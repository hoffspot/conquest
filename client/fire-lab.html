<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="theme-color" content="#101418">
        <meta name="description" content="Fire lab: the torches, braziers, camp fires, hearths, candles and fire spells of Pellagos at night, to look at and compare">

        <title>Fire Lab</title>

        <link rel="icon" href="images/icons/icon-192.png" type="image/png">
        <link rel="stylesheet" href="world-map.css">
        <script type="importmap">
            {
                "imports": {
                    "three": "./vendor/three-r186/three.module.min.js",
                    "three/addons/": "./vendor/three-r186/addons/"
                }
            }
        </script>
        <script type="module" src="js/lab/fire-lab.js"></script>
    </head>
    <body>
        <main id="atlas">
            <section id="viewport" aria-label="The fires">
                <canvas id="map"></canvas>
                <div id="status" role="status">Lighting…</div>
            </section>

            <aside id="panel" aria-label="Fire settings">
                <h1>Fire</h1>

                <div class="row">
                    <label for="look">Look at</label>
                    <select id="look">
                        <option value="all">All of them</option>
                        <option value="torch">A torch on a wall</option>
                        <option value="brazier">A brazier</option>
                        <option value="fire">A camp fire</option>
                        <option value="candles">Candles on a table</option>
                        <option value="burn">Burn (tier 1)</option>
                        <option value="fireball">Fireball (tier 2)</option>
                        <option value="burstflame">Burstflame (tier 3)</option>
                        <option value="immolate">Immolate (tier 4)</option>
                        <option value="flamefill">Flamefill (tier 5)</option>
                        <option value="inferno">Inferno (tier 6)</option>
                        <option value="hellfire">Hellfire (tier 7)</option>
                    </select>
                </div>

                <div class="row">
                    <label for="wind">Breeze</label>
                    <input id="wind" type="range" min="0" max="3" step="0.1" value="0.6">
                </div>

                <div class="row">
                    <label for="time">Time</label>
                    <select id="time">
                        <option value="night">Midnight</option>
                        <option value="dusk">Dusk</option>
                        <option value="day">Noon</option>
                    </select>
                </div>

                <p id="stats" class="muted"></p>
            </aside>
        </main>
    </body>
</html>
