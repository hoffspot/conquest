name: Mac app

# The menu-bar app (mac/) built on a Mac, put in its bundle with Node and the server and signed ad
# hoc (scripts/build-mac-app.js), then opened: its item in the menu bar (mac/ci/status-item.swift),
# its server answering on the usual port, and on Quit every world saved before it goes; and the
# Homebrew formula installed from a tap of its own and its test run; and the installer
# (scripts/install-mac.sh) run as a Mac's owner runs it, each way it installs, then taking it away
# (generated/world_server_plan.md §11, Phase 2; docs/MAC_APP.md). Run by hand (Actions, Mac app, Run workflow), and on a pull
# request that changes the app, its bundle, or how the server runs for it. A public repository's
# Mac runners cost nothing. The zip, the server's archive (signed with the project's release key,
# scripts/release-key.js, if the repository has it as the secret PELLAGOS_RELEASE_KEY) and the
# formula are kept with the run, for a release; and pictures of the screen with the app running,
# and its menu open
on:
  workflow_dispatch:
  pull_request:
    paths:
      - mac/**
      - scripts/build-mac-app.js
      - scripts/install-mac.sh
      - server/world.js
      - server/serve.js
      - server/launch.js
      - server/update/**
      - server/platform/**
      - .github/workflows/mac.yml

concurrency:
  group: mac-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mac:
    # (Apple Silicon, as macOS 27 runs on nothing else)
    runs-on: macos-15
    # (About 10 minutes: the Swift build, Node fetched, Homebrew's Node installed)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build the menu-bar app
        run: swift build -c release --arch arm64 --package-path mac

      - name: Make the bundle, sign it ad hoc and zip it; the server's archive and the formula
        run: node scripts/build-mac-app.js --executable "$(swift build -c release --arch arm64 --package-path mac --show-bin-path)/PellagosServer"

      - name: Sign the server's archive with the project's release key, if the repository has it
        env:
          PELLAGOS_RELEASE_KEY: ${{ secrets.PELLAGOS_RELEASE_KEY }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ -n "$PELLAGOS_RELEASE_KEY" ]; then
            node scripts/release-key.js --sign "dist/pellagos-server-$version.tar.gz"
            node scripts/release-key.js --verify "dist/pellagos-server-$version.tar.gz"
          else
            echo "No release key (the PELLAGOS_RELEASE_KEY secret): the archive isn't signed, so servers won't update to it."
          fi

      - name: Open the app, find its item in the menu bar, see its server answer, and quit it
        run: |
          log="$HOME/Library/Logs/io.github.hoffspot.pellagos-server/server.log"
          open "dist/Pellagos Server.app"
          for try in $(seq 1 60); do curl -sf http://localhost:8480/api/v1/health && break; sleep 1; done
          curl -sf http://localhost:8480/api/v1/health
          curl -sf http://localhost:8481/ > /dev/null
          pgrep -f "Pellagos Server.app/Contents/Helpers/node"
          # (Its item in the menu bar, found by where the app's windows are; then its menu, opened
          # with a click if the runner lets one be posted, pictured, and closed again)
          swiftc -O mac/ci/status-item.swift -o "$RUNNER_TEMP/status-item"
          sleep 2
          "$RUNNER_TEMP/status-item" "$(pgrep -x PellagosServer)"
          screencapture -x dist/screen.png || true
          "$RUNNER_TEMP/status-item" "$(pgrep -x PellagosServer)" click || true
          sleep 1
          screencapture -x dist/menu.png || true
          "$RUNNER_TEMP/status-item" "$(pgrep -x PellagosServer)" click || true
          # (Quit as the menu's Quit does, by Apple Event; if the runner won't send one, SIGTERM:
          # the app goes at once, and its server, its pipe closed, saves and stops just the same)
          if perl -e 'alarm 30; exec @ARGV' osascript -e 'tell application id "io.github.hoffspot.pellagos-server" to quit'; then echo "Quit, as the menu quits it"; else echo "Quit refused here: SIGTERM"; pkill -TERM -x PellagosServer; fi
          for try in $(seq 1 60); do pgrep -f "Pellagos Server.app/Contents/Helpers/node" > /dev/null || break; sleep 1; done
          # (A negated command never fails a step, so each is checked with if)
          if pgrep -f "Pellagos Server.app/Contents/Helpers/node"; then echo "Its server is still running"; exit 1; fi
          if pgrep -x PellagosServer; then echo "The app is still running"; exit 1; fi
          grep -E "^@pellagos|Saving every world" "$log"
          grep -q '"state":"stopped"' "$log"

      - name: Install it with the installer as a Mac's owner would (a zip from a browser, the newest release, built here), and take it away again
        run: |
          version=$(node -p 'require("./package.json").version')
          zip="$PWD/dist/Pellagos-Server-$version-arm64.zip"
          apps="$RUNNER_TEMP/Applications"
          app="$apps/Pellagos Server.app"
          log="$HOME/Library/Logs/io.github.hoffspot.pellagos-server/server.log"
          answers() { for try in $(seq 1 60); do curl -sf http://localhost:8480/api/v1/health > /dev/null && return 0; sleep 1; done; echo "Its server doesn't answer"; exit 1; }
          # (How many times its server has said it stopped, every world saved)
          stops() { grep -c '"state":"stopped"' "$log" || true; }
          # (A zip as a browser leaves it, marked as downloaded: checked, the mark taken off, installed, opened)
          cp "$zip" "$RUNNER_TEMP/downloaded.zip"
          xattr -w com.apple.quarantine "0083;$(printf %x "$(date +%s)");Safari;" "$RUNNER_TEMP/downloaded.zip"
          scripts/install-mac.sh --zip "$RUNNER_TEMP/downloaded.zip" --to "$apps"
          answers
          if xattr -p com.apple.quarantine "$app" 2> /dev/null; then echo "Still marked as downloaded"; exit 1; fi
          pgrep -f "$app/Contents/Helpers/node"
          sleep 2
          screencapture -x dist/installed.png || true
          # (The newest release, from an answer as GitHub's, read by osascript: the one running
          # stopped as Quit stops it, every world saved, and replaced)
          node -e 'const [zip, version, sha] = process.argv.slice(1); console.log(JSON.stringify([{ tag_name: "server-v" + version, draft: false, prerelease: false, assets: [{ name: "Pellagos-Server-" + version + "-arm64.zip", browser_download_url: "file://" + zip, digest: "sha256:" + sha }] }]))' "$zip" "$version" "$(shasum -a 256 "$zip" | cut -d' ' -f1)" > "$RUNNER_TEMP/releases.json"
          before=$(stops)
          PELLAGOS_RELEASES="file://$RUNNER_TEMP/releases.json" scripts/install-mac.sh --to "$apps"
          [ "$(stops)" -gt "$before" ]
          answers
          # (Built here from this copy: Swift's build and Node's archive kept from the steps before)
          scripts/install-mac.sh --build --source . --to "$apps"
          answers
          # (Taken away: stopped, every world saved, its worlds kept)
          before=$(stops)
          scripts/install-mac.sh --uninstall --to "$apps"
          test ! -e "$app"
          if pgrep -x PellagosServer || pgrep -f "Pellagos Server.app/Contents/Helpers/node"; then echo "It's still running"; exit 1; fi
          [ "$(stops)" -gt "$before" ]
          test -d "$HOME/Library/Application Support/io.github.hoffspot.pellagos-server/worlds"

      - name: Install the formula from a tap of its own, and run its test
        run: |
          version=$(node -p 'require("./package.json").version')
          brew tap-new --no-git local/pellagos
          sed "s|^  url .*|  url \"file://$PWD/dist/pellagos-server-$version.tar.gz\"|" dist/pellagos-server.rb > "$(brew --repository local/pellagos)/Formula/pellagos-server.rb"
          brew install local/pellagos/pellagos-server
          brew test local/pellagos/pellagos-server

      - name: Keep the zip, the server's archive and the formula
        uses: actions/upload-artifact@v4
        with:
          name: pellagos-server-mac
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.tar.gz.sig
            dist/pellagos-server.rb
          retention-days: 14

      - name: Keep the pictures of the screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-screen
          path: dist/*.png
          retention-days: 14
          if-no-files-found: ignore
