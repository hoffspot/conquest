name: Mac app

# The menu-bar app (mac/) built on a Mac, put in its bundle with Node and the server and signed ad
# hoc (scripts/build-mac-app.js), then opened: its item in the menu bar (mac/ci/status-item.swift),
# its server answering on the usual port, and on Quit every world saved before it goes; and the
# Homebrew formula installed from a tap of its own and its test run; and the installer
# (scripts/install-mac.sh) run as a Mac's owner runs it, each way it installs, then taking it away
# (generated/world_server_plan.md §11, Phase 2; docs/MAC_APP.md). Run on a pull request that
# changes the app, its bundle, or how the server runs for it; on main, for each change to what the
# app holds, when it then publishes it as a release (the release job): server-v<version>, the
# version package.json's major and minor and the count of main's commits, which the installer
# installs and servers update to; and by hand (Actions, Mac app, Run workflow), on main a release
# too. A public repository's Mac runners cost nothing. The zip, the server's archive (signed with
# the project's release key, scripts/release-key.js, if the repository has it as the secret
# PELLAGOS_RELEASE_KEY; checked by GitHub's SHA-256 for it otherwise) and the formula are kept
# with the run; and pictures of the screen with the app running, and its menu open
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - client/**
      - server/**
      - mac/**
      - package.json
      - scripts/build-mac-app.js
      - scripts/stamp-version.js
      - LICENSE
      - LICENSE-BOOK-CODE.txt
      - .github/workflows/mac.yml
  pull_request:
    paths:
      - mac/**
      - scripts/build-mac-app.js
      - scripts/install-mac.sh
      - server/world.js
      - server/serve.js
      - server/launch.js
      - server/update/**
      - server/platform/**
      - .github/workflows/mac.yml
      - .github/actions/licensed-models/**

# (A pull request's run cancelled by its next; main's one at a time, each finished, the newest
# waiting its turn: a release at a time, in order)
concurrency:
  group: mac-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mac:
    # (Apple Silicon, as macOS 27 runs on nothing else)
    runs-on: macos-15
    # (About 10 minutes: the Swift build, Node fetched, Homebrew's Node installed)
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # (Every commit, without their files: a release's version counts main's commits)
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # The licensed models, from the private repository, so the app's game has them
      # (docs/LICENSED_MODELS.md)
      - uses: ./.github/actions/licensed-models
        with:
          key: ${{ secrets.MODELS_DEPLOY_KEY }}

      # (As a release is numbered and stamped: package.json's version in the copy built here, and
      # client/js/app/version.js's commit, for the debug log; scripts/stamp-version.js)
      - name: Which version it is, and which code
        id: version
        run: |
          version=$(node -p 'require("./package.json").version.split(".").slice(0, 2).join(".")').$(git rev-list --count HEAD)
          node -e 'const fs = require("fs"); const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")); pkg.version = process.argv[1]; fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n")' "$version"
          node scripts/stamp-version.js client/js/app/version.js "$GITHUB_SHA"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"

      - name: Build the menu-bar app
        run: swift build -c release --arch arm64 --package-path mac

      - name: Make the bundle, sign it ad hoc and zip it; the server's archive and the formula
        run: node scripts/build-mac-app.js --executable "$(swift build -c release --arch arm64 --package-path mac --show-bin-path)/PellagosServer"

      - name: Sign the server's archive with the project's release key, if the repository has it
        env:
          PELLAGOS_RELEASE_KEY: ${{ secrets.PELLAGOS_RELEASE_KEY }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ -n "$PELLAGOS_RELEASE_KEY" ]; then
            node scripts/release-key.js --sign "dist/pellagos-server-$version.tar.gz"
            node scripts/release-key.js --verify "dist/pellagos-server-$version.tar.gz"
          else
            echo "No release key (the PELLAGOS_RELEASE_KEY secret): the archive isn't signed, so servers won't update to it."
          fi

      - name: Open the app, find its item in the menu bar, see its server answer, and quit it
        run: |
          log="$HOME/Library/Logs/io.github.hoffspot.pellagos-server/server.log"
          open "dist/Pellagos Server.app"
          for try in $(seq 1 60); do curl -sf http://localhost:8480/api/v1/health && break; sleep 1; done
          curl -sf http://localhost:8480/api/v1/health
          curl -sf http://localhost:8481/ > /dev/null
          pgrep -f "Pellagos Server.app/Contents/Helpers/node"
          # (Its item in the menu bar, found by where the app's windows are; then its menu, opened
          # with a click if the runner lets one be posted, pictured, and closed again)
          swiftc -O mac/ci/status-item.swift -o "$RUNNER_TEMP/status-item"
          sleep 2
          "$RUNNER_TEMP/status-item" "$(pgrep -x PellagosServer)"
          screencapture -x dist/screen.png || true
          "$RUNNER_TEMP/status-item" "$(pgrep -x PellagosServer)" click || true
          sleep 1
          screencapture -x dist/menu.png || true
          "$RUNNER_TEMP/status-item" "$(pgrep -x PellagosServer)" click || true
          # (Quit as the menu's Quit does, by Apple Event; if the runner won't send one, SIGTERM:
          # the app goes at once, and its server, its pipe closed, saves and stops just the same)
          if perl -e 'alarm 30; exec @ARGV' osascript -e 'tell application id "io.github.hoffspot.pellagos-server" to quit'; then echo "Quit, as the menu quits it"; else echo "Quit refused here: SIGTERM"; pkill -TERM -x PellagosServer; fi
          for try in $(seq 1 60); do pgrep -f "Pellagos Server.app/Contents/Helpers/node" > /dev/null || break; sleep 1; done
          # (A negated command never fails a step, so each is checked with if)
          if pgrep -f "Pellagos Server.app/Contents/Helpers/node"; then echo "Its server is still running"; exit 1; fi
          if pgrep -x PellagosServer; then echo "The app is still running"; exit 1; fi
          grep -E "^@pellagos|Saving every world" "$log"
          grep -q '"state":"stopped"' "$log"

      - name: Install it with the installer as a Mac's owner would (a zip from a browser, the newest release, built here), and take it away again (the app alone, then everything, its worlds archived)
        run: |
          version=$(node -p 'require("./package.json").version')
          zip="$PWD/dist/Pellagos-Server-$version-arm64.zip"
          apps="$RUNNER_TEMP/Applications"
          app="$apps/Pellagos Server.app"
          log="$HOME/Library/Logs/io.github.hoffspot.pellagos-server/server.log"
          data="$HOME/Library/Application Support/io.github.hoffspot.pellagos-server"
          answers() { for try in $(seq 1 60); do curl -sf http://localhost:8480/api/v1/health > /dev/null && return 0; sleep 1; done; echo "Its server doesn't answer"; exit 1; }
          # (How many times its server has said it stopped, every world saved)
          stops() { grep -c '"state":"stopped"' "$log" || true; }
          # (A zip as a browser leaves it, marked as downloaded: checked, the mark taken off, installed, opened)
          cp "$zip" "$RUNNER_TEMP/downloaded.zip"
          xattr -w com.apple.quarantine "0083;$(printf %x "$(date +%s)");Safari;" "$RUNNER_TEMP/downloaded.zip"
          scripts/install-mac.sh --zip "$RUNNER_TEMP/downloaded.zip" --to "$apps"
          answers
          if xattr -p com.apple.quarantine "$app" 2> /dev/null; then echo "Still marked as downloaded"; exit 1; fi
          pgrep -f "$app/Contents/Helpers/node"
          sleep 2
          screencapture -x dist/installed.png || true
          # (The newest release, from an answer as GitHub's, read by osascript: the one running
          # stopped as Quit stops it, every world saved, and replaced)
          node -e 'const [zip, version, sha] = process.argv.slice(1); console.log(JSON.stringify([{ tag_name: "server-v" + version, draft: false, prerelease: false, assets: [{ name: "Pellagos-Server-" + version + "-arm64.zip", browser_download_url: "file://" + zip, digest: "sha256:" + sha }] }]))' "$zip" "$version" "$(shasum -a 256 "$zip" | cut -d' ' -f1)" > "$RUNNER_TEMP/releases.json"
          before=$(stops)
          PELLAGOS_RELEASES="file://$RUNNER_TEMP/releases.json" scripts/install-mac.sh --to "$apps"
          [ "$(stops)" -gt "$before" ]
          answers
          # (Built here from this copy: Swift's build and Node's archive kept from the steps before)
          scripts/install-mac.sh --build --source . --to "$apps"
          answers
          # (The app alone taken away, --keep-data: stopped, every world saved, its data folder kept)
          before=$(stops)
          scripts/install-mac.sh --uninstall --keep-data --to "$apps"
          test ! -e "$app"
          if pgrep -x PellagosServer || pgrep -f "Pellagos Server.app/Contents/Helpers/node"; then echo "It's still running"; exit 1; fi
          [ "$(stops)" -gt "$before" ]
          test -f "$data/server.json"
          test -f "$data/secrets.json"
          # (Installed again, a world made from its management page as a browser there makes one)
          scripts/install-mac.sh --zip "$zip" --to "$apps"
          answers
          curl -sf -c "$RUNNER_TEMP/cookies" http://localhost:8481/ > /dev/null
          curl -sf -b "$RUNNER_TEMP/cookies" -H "x-pellagos: manage" -H "Content-Type: application/json" -d '{"name":"Carried","race":"human","seed":5}' http://localhost:8481/api/v1/worlds > /dev/null
          # (Everything taken away, every world saved to an archive first, as the app's Uninstall… asks
          # it to: none of what it kept left, and the archive as any server reads it)
          scripts/install-mac.sh --uninstall --archive --archive-to "$RUNNER_TEMP/archives" --to "$apps"
          test ! -e "$app"
          if pgrep -x PellagosServer || pgrep -f "Pellagos Server.app/Contents/Helpers/node"; then echo "It's still running"; exit 1; fi
          for kept in "$data" "$HOME/Library/Logs/io.github.hoffspot.pellagos-server" "$HOME/Library/Caches/io.github.hoffspot.pellagos-server"; do
            if [ -e "$kept" ]; then echo "Still kept: $kept"; exit 1; fi
          done
          node --input-type=module -e 'import { readFile } from "node:fs/promises"; import { readArchive, worldsIn } from "./server/storage/archive.js"; const archive = readArchive(await readFile(process.argv[1])); const names = worldsIn(archive).map((world) => world.name); console.log("The archive holds", names); if (names.join() !== "Carried" || !archive.files.has("identity.key")) process.exit(1);' "$RUNNER_TEMP"/archives/*.pellagos-archive

      - name: Install the formula from a tap of its own, and run its test
        run: |
          version=$(node -p 'require("./package.json").version')
          brew tap-new --no-git local/pellagos
          sed "s|^  url .*|  url \"file://$PWD/dist/pellagos-server-$version.tar.gz\"|" dist/pellagos-server.rb > "$(brew --repository local/pellagos)/Formula/pellagos-server.rb"
          brew install local/pellagos/pellagos-server
          brew test local/pellagos/pellagos-server

      - name: Keep the zip, the server's archive and the formula
        uses: actions/upload-artifact@v4
        with:
          name: pellagos-server-mac
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.tar.gz.sig
            dist/pellagos-server.rb
          retention-days: 14

      - name: Keep the pictures of the screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-screen
          path: dist/*.png
          retention-days: 14
          if-no-files-found: ignore

  # The release: what the mac job built, published as server-v<version> on main (pushed to, or run
  # by hand there), for the installer (scripts/install-mac.sh) and servers' updates
  # (server/update/releases.js): the app's zip, the server's archive and its signature if it was
  # signed. GitHub keeps each file's SHA-256, which both check against. Notes from the pull requests
  # merged since the release before. The newest 10 kept; older ones taken away, with their tags.
  release:
    needs: mac
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pellagos-server-mac
          path: dist

      - name: Publish it as a release, and keep the newest 10
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.mac.outputs.version }}
        run: |
          tag="server-v$VERSION"
          files=("dist/Pellagos-Server-$VERSION-arm64.zip" "dist/pellagos-server-$VERSION.tar.gz")
          if [ -f "dist/pellagos-server-$VERSION.tar.gz.sig" ]; then files+=("dist/pellagos-server-$VERSION.tar.gz.sig"); fi
          ls -l "${files[@]}"
          # (The server releases there are, the newest first, by version)
          releases() { gh release list --limit 200 --json tagName --jq '.[].tagName' | sed -n 's/^server-v\([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p' | sort -V -r; }
          # (The newest before this one, for the notes to start from)
          before=$(releases | while read -r one; do if [ "$(printf '%s\n%s\n' "$one" "$VERSION" | sort -V | tail -n 1)" = "$VERSION" ] && [ "$one" != "$VERSION" ]; then echo "$one"; break; fi; done)
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          elif [ -n "$before" ]; then
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --title "Pellagos Server $VERSION" --generate-notes --notes-start-tag "server-v$before"
          else
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --title "Pellagos Server $VERSION" --notes "The first release of Pellagos Server for the Mac, built from $GITHUB_SHA."
          fi
          # (GitHub's SHA-256 for each file, which the installer and servers check against)
          for try in $(seq 1 10); do
            digests=$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq '.assets[] | "\(.name) \(.digest)"')
            echo "$digests" | grep -q "^Pellagos-Server-$VERSION-arm64.zip sha256:" && echo "$digests" | grep -q "^pellagos-server-$VERSION.tar.gz sha256:" && break
            sleep 3
          done
          echo "$digests"
          echo "$digests" | grep -q "^Pellagos-Server-$VERSION-arm64.zip sha256:" || { echo "GitHub gives no SHA-256 for the zip: the installer can't check it"; exit 1; }
          echo "$digests" | grep -q "^pellagos-server-$VERSION.tar.gz sha256:" || { echo "GitHub gives no SHA-256 for the archive: servers can't check it"; exit 1; }
          releases | tail -n +11 | while read -r old; do
            echo "Taking away server-v$old"
            gh release delete "server-v$old" --cleanup-tag --yes
          done
