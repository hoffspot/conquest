name: CI

# Pull requests, and main when they're merged (a branch's pushes are tested once, in its pull
# request, not twice). A pull request's run tests it merged into main as main is then; with
# others merging too, main may move on after, so a pull request is merged only once it's green
# brought up to date with main (contribution.md, "Merging cleanly")
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A pull request's run is let go of when it's pushed to again (only its newest head matters, and
# GitHub runs 20 jobs at a time across everyone's); main's each run alone to the end (a group of
# their own, run_id)
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint and the unit tests: about 7½ minutes
  test:
    runs-on: ubuntu-latest
    # (Twenty minutes is more than twice the longest it's taken; a job hung longer is ended rather
    # than held to GitHub's six hours, as the e2e jobs are below)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

  # The motion check (scripts/motion-check.js): every motion on each people's bodies at the ends
  # of their builds, failing on anything worse than the baseline kept with it
  # (test/motion-baseline.json). About 10 minutes on a runner's 4 threads; its report is kept
  # with the run, for the contact sheet (motion-sheet.html, "Report")
  motion:
    runs-on: ubuntu-latest
    # (Twice the longest it's taken, 11 minutes, and a little more)
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check:motion
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-report
          path: test-results/motion/report.json
          retention-days: 14
          if-no-files-found: ignore

  # The end-to-end tests, split between jobs run side by side, each job's about as long as the
  # others' (scripts/e2e-shard.js: by how long each test took, e2e/durations.json). Eight jobs
  # take about 8 minutes each (and another 40 s or so getting ready): more would be quicker,
  # down to the longest test's 1¾ minutes, but a run is then 10 jobs (with the unit tests and the
  # motion check), and two runs at once (a merge's and the next pull request's) stay within
  # GitHub's 20 at a time
  e2e:
    runs-on: ubuntu-latest
    # (Twenty minutes is twice a job's usual, and half as long again as the longest; a job hung
    # longer is ended rather than held to GitHub's six hours)
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    name: e2e (${{ matrix.shard }} of ${{ strategy.job-total }})
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # (Without --with-deps: the runner already has the system libraries Chromium needs, as it
      # carries Google Chrome, and installing them with apt-get now and then hung for good on
      # Ubuntu's mirror. Chromium's own download is given 5 minutes a try, where it takes under
      # a minute, and it's tried three times)
      - name: Install Chromium for the end-to-end tests
        run: for try in 1 2 3; do timeout 300 npx playwright install chromium && exit 0; done; exit 1
      - name: Choose this job's share of the tests
        run: node scripts/e2e-shard.js ${{ matrix.shard }} ${{ strategy.job-total }} > e2e-share.txt
      - run: npx playwright test --test-list e2e-share.txt
