name: CI

# Pull requests, and main when they're merged (a branch's pushes are tested once, in its pull
# request, not twice)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Lint and the unit tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

  # The end-to-end tests, split between jobs run side by side, each job's about as long as the
  # others' (scripts/e2e-shard.js: by how long each test took, e2e/durations.json). More jobs
  # here, the shorter each; the longest test is as short as a job can be
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: e2e (${{ matrix.shard }} of ${{ strategy.job-total }})
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium for the end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: Choose this job's share of the tests
        run: node scripts/e2e-shard.js ${{ matrix.shard }} ${{ strategy.job-total }} > e2e-share.txt
      - run: npx playwright test --test-list e2e-share.txt
