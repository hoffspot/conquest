name: CI

# Pull requests, and by hand (Actions, CI, Run workflow, on any branch). A pull request's run
# tests it merged into main as main is then; with others merging too, main may move on after, so
# a pull request is merged only once it's green brought up to date with main (contribution.md,
# "Merging cleanly").
#
# Not main when one's merged: main's ruleset lets a pull request in only with every required
# check green on a head that's up to date with main (contribution.md, "The repository's
# settings"), so what a merge makes of main is, file for file, what that run tested. For each of
# the 60 merges before this was written the merge commit's tree was its branch head's. Tested
# again on main, those runs were a third of all CI's, held half of GitHub's 20 jobs at a time for
# most of an hour after every merge while the next pull request waited, and one in four failed,
# always on a test that fails now and then, never on a fault. If either of those two rules is
# ever turned off, put "push: branches: [main]" back here first
on:
  pull_request:
  workflow_dispatch:

# A pull request's run is let go of when it's pushed to again (only its newest head matters, and
# GitHub runs 20 jobs at a time across everyone's); one run by hand runs alone to the end (a
# group of its own, run_id)
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The browser tests' split (scripts/e2e-shard.js, .github/actions/e2e-share), the same in every
# job: ten shares, the eight e2e jobs' and, once their own work's done, the motion check's (the
# last share but one: about 13 minutes of its own first) and the unit tests' (the last: about 20),
# so that every job ends about together rather than two of them standing idle for half the run.
# E2E_SHARES is the e2e jobs (the matrix's shards, below) and those two: for more or fewer e2e
# jobs, change the matrix and E2E_SHARES together and nothing else (test/contribution.test.js
# checks every share is one job's), but only once "ci" is the ruleset's one required check
# (contribution.md, "The repository's settings"): until then each e2e job is required by name
env:
  E2E_SHARES: 10
  E2E_AHEAD: "last-1:13,last:20"

jobs:
  # Lint and the unit tests (about 19½ minutes, four test files at a time on the runner's four
  # threads), then its share of the browser tests (the last share: about 8 minutes)
  test:
    runs-on: ubuntu-latest
    # (Sixty minutes is twice the longest it should take, and a little more; a job hung longer is
    # ended rather than held to GitHub's six hours, as the e2e jobs are below)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # The licensed models, from the private repository (docs/LICENSED_MODELS.md)
      - uses: ./.github/actions/licensed-models
        with:
          key: ${{ secrets.MODELS_DEPLOY_KEY }}

      - run: npm ci
      - run: npm run lint
      # (Four test files at a time, one a thread: Node's own choice is a thread fewer, and four
      # took a little less time, 19 minutes against 19½ to 20)
      - run: npm test -- --test-concurrency=4

      # (Whether or not the unit tests passed: the browser tests' run is whole either way)
      - name: Its share of the browser tests
        if: ${{ !cancelled() }}
        uses: ./.github/actions/e2e-share
        with:
          share: last
          shares: ${{ env.E2E_SHARES }}
          ahead: ${{ env.E2E_AHEAD }}

  # The motion check (scripts/motion-check.js): every motion on each people's bodies at the ends
  # of their builds, failing on anything worse than the baseline kept with it
  # (test/motion-baseline.json). About 8 to 13 minutes on a runner's 4 threads; its report is kept
  # with the run, for the contact sheet (motion-sheet.html, "Report"). Then its share of the
  # browser tests (the last share but one: about 15 minutes)
  motion:
    runs-on: ubuntu-latest
    # (Twice the longest it should take, and a little more)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # The licensed models, for its share of the browser tests (docs/LICENSED_MODELS.md)
      - uses: ./.github/actions/licensed-models
        with:
          key: ${{ secrets.MODELS_DEPLOY_KEY }}

      - run: npm ci
      - run: npm run check:motion
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-report
          path: test-results/motion/report.json
          retention-days: 14
          if-no-files-found: ignore

      # (Whether or not the motion check passed: the browser tests' run is whole either way)
      - name: Its share of the browser tests
        if: ${{ !cancelled() }}
        uses: ./.github/actions/e2e-share
        with:
          share: last-1
          shares: ${{ env.E2E_SHARES }}
          ahead: ${{ env.E2E_AHEAD }}

  # The end-to-end tests, split between jobs run side by side, each job's about as long as the
  # others' (scripts/e2e-shard.js: by how long each test took on CI, e2e/durations.json; the
  # unit tests' and the motion check's jobs take shares too, after their own work: env above).
  # Eight jobs take about 28 minutes each (and another 30 s or so getting ready): more would be
  # quicker, down to the longest test's 4¾ minutes, but a run is 10 jobs (with the unit tests
  # and the motion check), and two runs at once (two pull requests') stay within GitHub's 20 at
  # a time
  e2e:
    runs-on: ubuntu-latest
    # (Eighty minutes is twice the longest a job's taken, 40; a job hung longer is ended rather
    # than held to GitHub's six hours. At twenty, then at forty, a job was ended still running
    # as the tests grew: at forty, #600's merge, every test passed)
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    name: e2e (${{ matrix.shard }} of ${{ strategy.job-total }})
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # The licensed models, from the private repository (docs/LICENSED_MODELS.md)
      - uses: ./.github/actions/licensed-models
        with:
          key: ${{ secrets.MODELS_DEPLOY_KEY }}

      - run: npm ci
      - name: Its share of the browser tests
        uses: ./.github/actions/e2e-share
        with:
          share: ${{ matrix.shard }}
          shares: ${{ env.E2E_SHARES }}
          ahead: ${{ env.E2E_AHEAD }}

  # Whether every job above passed, as one check: the one main's ruleset is to require
  # (contribution.md, "The repository's settings"), in place of each job by its name, so that
  # jobs here are added, renamed or made more of without a setting changed. A job added above
  # goes in its needs (test/contribution.test.js checks every one is there). It runs whatever
  # became of them (always()): left to itself it would be skipped when one of them failed, and
  # GitHub takes a required check that was skipped as passed
  ci:
    needs: [test, motion, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # (Each job's result said, the e2e jobs' as one; then failed unless every one is "success":
      # not failure, cancelled or skipped)
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
