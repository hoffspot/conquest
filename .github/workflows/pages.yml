name: Deploy to GitHub Pages

# Publishes the game (the client folder) to https://<owner>.github.io/<repo>/ whenever main changes.
# GitHub Pages only serves files, so this copy of the game has the campaign but no multiplayer
# server. To add multiplayer, run the server somewhere (npm start) and set the MULTIPLAYER_SERVER
# repository variable (Settings > Secrets and variables > Actions > Variables) to its address,
# for example wss://last-colony.example.com

on:
  push:
    branches: [main]
  workflow_dispatch:

# Let one deployment finish before the next starts
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Put the site together
        env:
          MULTIPLAYER_SERVER: ${{ vars.MULTIPLAYER_SERVER }}
        run: |
          cp -R client _site
          node -e 'console.log(`export const MULTIPLAYER_SERVER = ${JSON.stringify(process.env.MULTIPLAYER_SERVER || null)};`)' > _site/js/app/hosting.js
          cat _site/js/app/hosting.js

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
