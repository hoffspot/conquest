name: Deploy to GitHub Pages

# Publishes the game (the client folder) to https://<owner>.github.io/<repo>/ whenever main changes.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Let one deployment finish before the next starts
concurrency:
  group: pages
  cancel-in-progress: false

# (Each job is ended at about twice the longest it's taken, the build 8 minutes and the deploy
# under 3, rather than held to GitHub's six hours if it hangs)
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Put the site together
        run: |
          npm run build:manifest
          cp -R client _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
