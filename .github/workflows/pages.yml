name: Deploy to GitHub Pages

# Publishes the game (the client folder) to https://<owner>.github.io/<repo>/ whenever main changes.
#
# Nothing is tested here. What's merged to main is, file for file, what its pull request's CI just
# passed (ci.yml, at its top: main's ruleset sees to it), so lint and the unit tests run again here
# only kept the site waiting: 17½ of the build's 18 minutes, and not one failure of theirs in a
# hundred of CI's runs.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Let one deployment finish before the next starts
concurrency:
  group: pages
  cancel-in-progress: false

# (Each job is ended rather than held to GitHub's six hours if it hangs: the build, under a minute
# of work, at 10; the deploy, under 2 minutes, at 15, as actions/deploy-pages gives up at 10 itself)
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # The licensed models, from the private repository, so the site has them
      # (docs/LICENSED_MODELS.md)
      - uses: ./.github/actions/licensed-models
        with:
          key: ${{ secrets.MODELS_DEPLOY_KEY }}

      # (Nothing below needs what this installs, a few seconds' work: it's here because this is
      # the one run on main with npm's cache (setup-node's, above), and a cache kept on main is
      # one every pull request's CI can take, where one kept in a pull request is its own alone)
      - run: npm ci

      - name: Put the site together
        run: |
          npm run build:manifest
          cp -R client _site

      # (The site's copy alone: the comments and indentation taken out of the game's code, a source
      # map beside each file, and the manifest and the page's import map made again, so every hash
      # is of the file as the site serves it: scripts/build-site.js. Then which code this is,
      # written into the copy for the debug log: the commit and when, in place of
      # client/js/app/version.js's noughts: scripts/stamp-version.js, after the manifest's made)
      - name: Strip the site's code and stamp its version
        run: |
          node scripts/build-site.js _site
          node scripts/stamp-version.js _site/js/app/version.js "$GITHUB_SHA"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
